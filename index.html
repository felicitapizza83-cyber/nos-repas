<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cook Easy</title>
  <meta name="description" content="Cook Easy — menus de la semaine, courses et budget, sans charge mentale." />

  <!-- Installation sur iPhone (Safari › Partager › Sur l'écran d'accueil) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" id="meta-theme" content="#f6f2ed" />
  <!-- Appliquer la couleur et le mode choisis avant l'affichage (évite un flash) -->
  <script>
    try {
      var a = JSON.parse(localStorage.getItem('nos-repas-apparence')) || {};
      document.documentElement.dataset.couleur = (a.couleur && a.couleur !== 'marrakech') ? a.couleur : 'orange';
      if (a.mode === 'light' || a.mode === 'dark') document.documentElement.dataset.theme = a.mode;
    } catch (e) {}
  </script>
  <link rel="preload" href="fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cook Easy" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <button id="btn-menu" class="rond" aria-label="Menu : outils, réglages, aide">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
      </button>
      <div class="topbar-titre"><a id="back" class="back" href="#/accueil" hidden>‹ Retour</a><h1 id="title">Cook Easy</h1></div>
      <button id="btn-minuteur" class="minuteur-pill" hidden aria-label="Minuteurs en cours"></button>
      <div id="topbar-action"></div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Navigation">
    <div class="nav-brand"><img src="icons/icon-192.png" alt="" />Cook Easy</div>
    <a href="#/accueil" data-route="accueil">

    <a href="#/menu" data-route="menu">

    <a href="#/courses" data-route="courses">

    <a href="#/budget" data-route="budget">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 14.5h2"/></svg><span>Budget</span></a>
    <button class="nav-plus" data-drawer>
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg><span>Outils & réglages</span></button>
  </nav>
